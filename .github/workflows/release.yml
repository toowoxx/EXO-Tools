name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

env:
  IMAGE_NAME: ghcr.io/toowoxx/exo-tools

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set build timestamp
        id: build_time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.value }}

      - name: Scan published image for vulnerabilities
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  post-deploy-smoke:
    if: ${{ always() && (github.event_name == 'release' || needs.build-and-push.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build-and-push
    environment: production
    permissions: {}
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
      PRODUCTION_BASE_URL_VAR: ${{ vars.PRODUCTION_BASE_URL }}
      PRODUCTION_BASE_URL_SECRET: ${{ secrets.PRODUCTION_BASE_URL }}
    steps:
      - name: Resolve production base URL
        id: base_url
        run: |
          base_url="${PRODUCTION_BASE_URL_VAR:-${PRODUCTION_BASE_URL_SECRET:-}}"
          if [ -z "$base_url" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production smoke test because PRODUCTION_BASE_URL is not configured."
            exit 0
          fi
          base_url="${base_url%/}"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "value=$base_url" >> "$GITHUB_OUTPUT"

      - name: Wait for production deployment and verify /health
        if: steps.base_url.outputs.configured == 'true'
        run: |
          rm -f /tmp/production-health.json
          for attempt in $(seq 1 10); do
            if curl -fsS "${{ steps.base_url.outputs.value }}/health" -o /tmp/production-health.json; then
              actual_status="$(node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/production-health.json','utf8')); process.stdout.write(String(body.status ?? ''));" )"
              actual_commit="$(node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/production-health.json','utf8')); process.stdout.write(String(body.commit ?? ''));" )"
              if [ "$actual_status" = "ok" ] && [ "$actual_commit" = "$EXPECTED_COMMIT" ]; then
                echo "Production health check passed."
                exit 0
              fi
              echo "Attempt $attempt/10: expected status=ok commit=$EXPECTED_COMMIT but received status=$actual_status commit=$actual_commit."
              cat /tmp/production-health.json
            else
              echo "Attempt $attempt/10: production /health endpoint is not ready yet."
            fi
            sleep $((attempt * 12))
          done
          echo "Production deployment never reported the expected commit within the retry window."
          exit 1

      - name: Verify production login page
        if: steps.base_url.outputs.configured == 'true'
        run: |
          status="$(curl -sS -o /tmp/production-login.html -w '%{http_code}' "${{ steps.base_url.outputs.value }}/login")"
          if [ "$status" != "200" ]; then
            echo "Expected GET /login to return 200 but received $status."
            exit 1
          fi
